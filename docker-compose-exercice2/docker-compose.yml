services:
  quiz-docker:
    image: quiz-docker:secure
    container_name: quiz-docker
    ports:
      - 8082:3000
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M